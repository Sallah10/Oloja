# Keeps the Render free-tier backend awake.
#
# Render's free web services sleep after ~15 minutes with no traffic, and the
# first request afterwards can take 30-60s. This job pings /health every 10
# minutes (a read-only GET, so it is safe) so the till never waits on a cold
# start. Free: scheduled workflows run on public repos with no minutes limit.
#
# Render also pings /health itself every 60s while a deploy health check is in
# progress; this is the between-deploys companion to that.

name: keep backend awake

on:
  schedule:
    # Every 10 minutes. GitHub adds a few minutes of jitter to schedules, which
    # is fine - the service stays far below the 15-minute sleep threshold.
    - cron: "*/10 * * * *"
  # Run it by hand from the Actions tab to check it works.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Oloja API health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://oloja-api.onrender.com/health && echo ""